name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (test extra adds pytest + requests for the OpenRouter tests)
        run: pip install "./cli[test]"
      - name: Run tests
        run: python -m pytest cli/tests -q
      - name: Validate the example sidecar
        run: python -c "from cdaf import load; load('examples/sunset-drone.cdaf'); print('example sidecar valid')"
      - name: CLI smoke check
        run: cdaf --version
